[workspace]
resolver = "3"
members = [
  "crates/domain",
  "crates/app",
  "crates/store",
  "crates/cli",
  "crates/tui",
  "crates/text",
]

[workspace.package]
edition = "2024"
version = "0.1.1"
license = "LicenseRef-ACVC-NonCommercial"
publish = false

[workspace.dependencies]
acvc-domain = { path = "crates/domain" }
acvc-app = { path = "crates/app" }
acvc-store = { path = "crates/store" }
acvc-tui = { path = "crates/tui" }
acvc-text = { path = "crates/text" }
blake3 = "1.5"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
reflink-copy = "0.1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
memmap2 = "0.9"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
ratatui = "0.30"
