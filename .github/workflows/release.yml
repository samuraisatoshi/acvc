name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Tag matches the package version
        run: |
          version=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          tag="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag"
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --locked --release -p acvc-cli --target ${{ matrix.target }}
      - name: Package
        run: |
          name="acvc-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/acvc" "$name/acvc"
          cp LICENSE "$name/LICENSE"
          chmod 755 "$name/acvc"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: acvc-*.tar.gz

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: ACVC ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          body: |
            ACVC 0.1.2.

            Since 0.1.1:
            - `acvc assistant` tells an agent how `record` chooses a parent, which edge to use, and that `score` does not change the variant id.
            - The paper reads Scion against that gate. `promote` may be called by an agent or by a person. The section draws both workflows.
            - The README, the paper, and the TLC check of the frontier are in the repository. They describe which attempts stay out of Git.

            ACVC records hypotheses, trials, and the frontier outside Git. Git receives the tree `promote` copies. The caller may be an agent or a person.

            This release is covered by the ACVC Non-Commercial Research License in LICENSE.
            Commercial use is not granted. That includes freeware, freemium, and research or study whose purpose is to produce commercial software. Those uses need written authorization from Samuraisatoshi at samuraisatoshi@cryptoworld.8shield.net.
            A derivative made for research is allowed when the final product is not commercial. It must credit Samuraisatoshi and the original ACVC work, and the derived source must be public under this same license.

            Spontaneous donations, and deposits toward a commercial license, go to one of these addresses. Send the transaction id of the deposit to samuraisatoshi@cryptoworld.8shield.net. A donation does not buy a commercial license. Commercial use starts only with written authorization.
            - Bitcoin (Native SegWit): bc1qzc427krz6zlvpdpz4x7h87y0qmf4u79aktx8c8
            - Solana: D92qzo3ati5YEzbTboXbwm1PpgkWu5BeXSV1j4X6tEGR
            - Liquid (L-BTC, L-USDT): lq1qqgj94smm95wuh4wdsea5jnpvjj7qv7g422zy4g2k5yyllhunr3zzpa75hjpgq6s0aw3mpts7x5y6gkvjxwx756xer8rwx8yyq

            Archives contain the `acvc` binary and LICENSE.
            - Linux x86_64
            - macOS Apple Silicon

            Verify a download with SHA256SUMS.
