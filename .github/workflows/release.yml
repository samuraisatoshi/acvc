name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Tag matches the package version
        run: |
          version=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          tag="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag"
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --locked --release -p acvc-cli --target ${{ matrix.target }}
      - name: Package
        run: |
          name="acvc-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/acvc" "$name/acvc"
          cp LICENSE "$name/LICENSE"
          chmod 755 "$name/acvc"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: acvc-*.tar.gz

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: ACVC ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          body: |
            First release of ACVC (Agent Code Variant Control).

            ACVC records an agent's hypotheses, trials, and the Pareto frontier outside Git. Git still stores the variant a person chooses to record.

            This release is covered by the ACVC Non-Commercial Research License in LICENSE.
            Commercial use is not granted. That includes freeware, freemium, and research or study whose purpose is to produce commercial software. Those uses need written authorization from Samuraisatoshi at samuraisatoshi@cryptoworld.8shield.net.
            A derivative made for research is allowed when the final product is not commercial. It must credit Samuraisatoshi and the original ACVC work, and the derived source must be public under this same license.

            Archives contain the `acvc` binary and LICENSE.
            - Linux x86_64
            - macOS Apple Silicon

            Verify a download with SHA256SUMS.
